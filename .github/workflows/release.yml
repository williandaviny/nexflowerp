name: 'Release Build'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop (.exe)
        run: npx tauri build --bundles nsis

      - name: Upload Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: NexFlow ERP ${{ github.ref_name || 'v1.0.3' }}
          body: |
            ## 🚀 NexFlow ERP - Instalador Windows
            
            Sistema comercial completo, leve e offline-first para Windows 10/11.
            
            - **Instalador Oficial:** Baixe o arquivo `.exe` abaixo para instalar no computador.
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
