[package]
name = "nexflow-erp"
version = "1.3.0"
description = "NexFlow ERP - Sistema de Gestão Comercial e PDV"
authors = ["Voortz <contato@voortz.com.br>"]
edition = "2021"

[lib]
name = "nexflow_erp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
